name: portfolio

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portfolio_net

  # ── ASP.NET Core API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/Portfolio.Api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENV:-Production}
      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Database=${POSTGRES_DB:-portfolio};
        Username=${POSTGRES_USER:-portfolio_user};
        Password=${POSTGRES_PASSWORD};
        Include Error Detail=true
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPass: ${SMTP_PASS:-}
      Email__ToAddress: ${NOTIFY_EMAIL:-sirsatyamchaudhary@gmail.com}
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - portfolio_net

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: src/Portfolio.Client
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${API_INTERNAL_URL:-http://api:8080}
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portfolio_net

volumes:
  postgres_data:
    driver: local

networks:
  portfolio_net:
    driver: bridge
